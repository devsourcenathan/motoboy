[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; **Le nombre d'enfants borne le nombre de connexions à la base.** Chaque
; processus en ouvre une et la garde ; Neon plafonne les connexions directes, et
; les dépasser se manifeste par des erreurs intermittentes au pire moment plutôt
; que par un refus franc au démarrage.
pm = static
pm.max_children = 8

; Recycle un enfant après 500 requêtes : borne l'effet d'une fuite mémoire dans
; une dépendance sans avoir à la trouver.
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Les journaux vont sur la sortie standard, que l'hébergeur agrège.
access.log = /dev/null
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
