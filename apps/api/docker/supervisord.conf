; Rôle `web` : nginx, php-fpm, et le travail de fond.
;
; Le planificateur et la file tournent ici tant que le volume ne justifie pas de
; les séparer. Ce n'est pas de la commodité : sans planificateur,
; `ReleaseExpiredHolds` ne tourne plus et l'inventaire se gèle — un paiement
; abandonné immobilise sa place indéfiniment (B2). Un déploiement web-seul
; casserait le produit sans qu'aucune erreur ne le signale.
;
; Les deux se coupent par `RUN_SCHEDULER=false` / `RUN_QUEUE=false` le jour où
; ils passent sur des services dédiés.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; `schedule:work` remplace une entrée cron : il reste en vie et déclenche à la
; minute. Une tâche planifiée sur l'hôte relancerait un conteneur par minute,
; avec un démarrage à froid à chaque fois.
[program:scheduler]
; **`www-data`, et non root.**
;
; supervisord démarre en root pour lier le port ; ses programmes n'en ont aucun
; besoin. Laissés en root, l'ordonnanceur et le worker créaient
; `storage/logs/laravel.log` à leur nom — et php-fpm, qui tourne en `www-data`,
; ne pouvait plus y ajouter une ligne. Laravel basculait alors sur son
; journaliseur de secours, échouait aussi, et **cet échec-là** remontait en 500 à
; la place de l'erreur d'origine. Une candidature d'agence refusée le 20 août
; 2026 ne disait rien d'autre que « permission denied » sur un fichier de
; journal.
;
; Faire tourner du code applicatif en root dans un conteneur ne se justifiait de
; toute façon pas.
user=www-data
command=/bin/sh -c 'if [ "${RUN_SCHEDULER:-true}" = "true" ]; then exec php /var/www/html/artisan schedule:work; else sleep infinity; fi'
autostart=true
autorestart=true
priority=30
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
; **`www-data`, et non root.**
;
; supervisord démarre en root pour lier le port ; ses programmes n'en ont aucun
; besoin. Laissés en root, l'ordonnanceur et le worker créaient
; `storage/logs/laravel.log` à leur nom — et php-fpm, qui tourne en `www-data`,
; ne pouvait plus y ajouter une ligne. Laravel basculait alors sur son
; journaliseur de secours, échouait aussi, et **cet échec-là** remontait en 500 à
; la place de l'erreur d'origine. Une candidature d'agence refusée le 20 août
; 2026 ne disait rien d'autre que « permission denied » sur un fichier de
; journal.
;
; Faire tourner du code applicatif en root dans un conteneur ne se justifiait de
; toute façon pas.
user=www-data
command=/bin/sh -c 'if [ "${RUN_QUEUE:-true}" = "true" ]; then exec php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=3; else sleep infinity; fi'
autostart=true
autorestart=true
priority=30
; Laisse le job en cours se terminer avant l'arrêt : une notification
; d'annulation coupée en deux laisse la moitié des passagers non prévenus.
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
