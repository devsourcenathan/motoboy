; Rôle `web` : nginx, php-fpm, et le travail de fond.
;
; Le planificateur et la file tournent ici tant que le volume ne justifie pas de
; les séparer. Ce n'est pas de la commodité : sans planificateur,
; `ReleaseExpiredHolds` ne tourne plus et l'inventaire se gèle — un paiement
; abandonné immobilise sa place indéfiniment (B2). Un déploiement web-seul
; casserait le produit sans qu'aucune erreur ne le signale.
;
; Les deux se coupent par `RUN_SCHEDULER=false` / `RUN_QUEUE=false` le jour où
; ils passent sur des services dédiés.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; `schedule:work` remplace une entrée cron : il reste en vie et déclenche à la
; minute. Une tâche planifiée sur l'hôte relancerait un conteneur par minute,
; avec un démarrage à froid à chaque fois.
[program:scheduler]
; **Ces deux programmes tournent en root, et c'est assumé pour l'instant.**
;
; Je les avais passés en `www-data` — parce que du code applicatif n'a pas à
; tourner en root dans un conteneur — et ça a cassé deux choses : supervisord
; change d'utilisateur mais pas d'environnement, si bien que `HOME` restait
; `/root` et que libpq y cherchait un certificat client dans un répertoire
; devenu illisible, faisant échouer chaque connexion à Neon ; et supervisord ne
; parvenait plus à arrêter ses propres enfants.
;
; Or le changement ne servait plus à rien : il visait un `laravel.log` créé en
; root que php-fpm ne pouvait plus rouvrir, et **plus rien n'écrit dans ce
; fichier** depuis que `LOG_EMERGENCY_PATH` pointe sur `stderr`. Le corriger en
; ajoutant `HOME` aurait consolidé un détour dont la raison d'être avait
; disparu.
;
; À reprendre proprement le jour où on voudra vraiment abandonner root : il
; faudra `HOME`, vérifier ce que supervisord sait signaler, et l'éprouver sur un
; déploiement de recette — pas sur celui qui sert les paiements.
command=/bin/sh -c 'if [ "${RUN_SCHEDULER:-true}" = "true" ]; then exec php /var/www/html/artisan schedule:work; else sleep infinity; fi'
autostart=true
autorestart=true
priority=30
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=/bin/sh -c 'if [ "${RUN_QUEUE:-true}" = "true" ]; then exec php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=3; else sleep infinity; fi'
autostart=true
autorestart=true
priority=30
; Laisse le job en cours se terminer avant l'arrêt : une notification
; d'annulation coupée en deux laisse la moitié des passagers non prévenus.
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
