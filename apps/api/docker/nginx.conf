user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Journal en JSON : les traces partent sur la sortie standard, que
    # l'hébergeur agrège. Une ligne structurée se filtre, une ligne de texte se
    # relit à la main (I7).
    log_format json escape=json '{"time":"$time_iso8601","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"duration":$request_time,'
        '"ip":"$http_x_forwarded_for","agent":"$http_user_agent"}';

    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Les chemins temporaires par défaut ne sont pas accessibles en écriture
    # quand le conteneur tourne en lecture seule.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Doit rester au-dessus de la borne PHP : c'est nginx qui refuserait le
    # premier, et avec un 413 que le client ne sait pas interpréter, là où PHP
    # rend une erreur typée du contrat.
    client_max_body_size 12M;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # L'en-tête de version révèle la pile sans rien apporter.
        server_tokens off;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # Un paiement Mobile Money attend la sollicitation du prestataire :
            # la borne par défaut de 60 s coupe des requêtes qui aboutissent.
            fastcgi_read_timeout 120;
        }

        # Rien d'autre n'exécute du PHP. Sans cette borne, un fichier déposé
        # sous un nom se terminant par `.php` deviendrait exécutable.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
