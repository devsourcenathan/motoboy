; Réglages de production.

memory_limit = 256M
max_execution_time = 120

; Doit rester **sous** la borne de nginx : c'est PHP qui doit refuser en
; premier, pour que la réponse porte un code d'erreur du contrat plutôt qu'un
; 413 brut que le client ne sait pas interpréter.
upload_max_filesize = 10M
post_max_size = 10M

; Les erreurs partent sur la sortie standard, jamais dans la réponse : une trace
; PHP rendue au client expose des chemins, des requêtes et parfois des
; identifiants.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Le code ne change jamais dans un conteneur : revalider à chaque requête
; coûterait un appel système par fichier pour rien.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
