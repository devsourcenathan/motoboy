<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom floating label styles */
        .floating-input:focus-within label,
        .floating-input input:not(:placeholder-shown) + label {
            transform: translateY(-50%) scale(0.85);
            top: 0;
            background-color: theme('colors.surface-container-lowest');
            padding: 0 4px;
            color: theme('colors.secondary-fixed-variant');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-4">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto flex flex-col">
<!-- Header / Logo Area -->
<header class="w-full flex flex-col items-center justify-center mb-xl">
<!-- Simulated Logo Graphic -->
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined fill-icon text-display-lg text-on-primary-container" style="font-size: 40px;">two_wheeler</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">MOTOBOY</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs text-center">Déplacez-vous en toute confiance.</p>
</header>
<!-- Authentication Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.05)] border border-outline-variant p-lg w-full">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-md">Connexion / Inscription</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">Saisissez vos coordonnées pour continuer. Un code de vérification vous sera envoyé.</p>
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Phone Number Input Group -->
<div class="relative floating-input">
<div class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest overflow-hidden focus-within:border-secondary focus-within:border-2 focus-within:-m-[1px] transition-all">
<!-- Country Code Select -->
<div class="flex items-center pl-sm pr-xs py-sm bg-surface-container-low border-r border-outline-variant text-on-surface-variant cursor-pointer">
<span class="font-body-md text-body-md font-semibold">+237</span>
<span class="material-symbols-outlined text-[16px] ml-xs">arrow_drop_down</span>
</div>
<!-- Phone Input -->
<input class="peer w-full bg-transparent border-none focus:ring-0 px-sm py-sm font-body-lg text-body-lg text-on-surface" id="phone" name="phone" placeholder=" " required="" type="tel"/>
<label class="absolute left-[88px] top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant transition-all duration-200 pointer-events-none" for="phone">
                            Numéro de téléphone
                        </label>
</div>
</div>
<!-- Email Input Group -->
<div class="relative floating-input">
<div class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest focus-within:border-secondary focus-within:border-2 focus-within:-m-[1px] transition-all">
<span class="material-symbols-outlined text-on-surface-variant pl-sm pr-xs py-sm">mail</span>
<input class="peer w-full bg-transparent border-none focus:ring-0 px-sm py-sm font-body-lg text-body-lg text-on-surface" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute left-10 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant transition-all duration-200 pointer-events-none" for="email">
                            Adresse e-mail
                        </label>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold py-[14px] rounded-full mt-sm hover:bg-surface-tint hover:text-on-primary transition-colors flex items-center justify-center gap-xs active:shadow-none active:scale-[0.98]" type="submit">
<span class="">Recevoir le code</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Legal / Terms -->
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-lg text-[12px] leading-tight">
                En continuant, vous acceptez nos <a class="text-secondary font-semibold underline decoration-secondary/30 underline-offset-2" href="#">Conditions d'utilisation</a> et notre <a class="text-secondary font-semibold underline decoration-secondary/30 underline-offset-2" href="#">Politique de confidentialité</a>.
            </p>
</div>
</main>
<script>
        // Simple micro-interaction for button press effect
        const btn = document.querySelector('button[type="submit"]');
        if(btn) {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.98)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        }
    </script>
</body></html>
