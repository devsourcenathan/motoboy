<script>
        document.addEventListener('DOMContentLoaded', () => {
            const seats = document.querySelectorAll('.seat:not([disabled])');
            const selectionText = document.getElementById('selection-text');
            const priceText = document.getElementById('price-text');
            const btnContinue = document.getElementById('btn-continue');
            
            let selectedSeat = null;
            let currentPrice = 0;

            // Define classes for active state based on brand guidelines (Dynamic Yellow + Navy Text)
            const activeClasses = ['bg-primary-container', 'border-primary', 'text-on-secondary-fixed', 'shadow-md'];
            const inactiveClasses = ['bg-surface-container-lowest', 'border-outline-variant', 'text-on-surface'];

            seats.forEach(seat => {
                seat.addEventListener('click', function() {
                    const seatId = this.getAttribute('data-seat');
                    const seatPrice = parseInt(this.getAttribute('data-price'), 10);

                    // Deselect previous
                    if (selectedSeat && selectedSeat !== this) {
                        selectedSeat.classList.remove(...activeClasses);
                        selectedSeat.classList.add(...inactiveClasses);
                    }

                    // Toggle current
                    if (this === selectedSeat) {
                        // Deselecting
                        this.classList.remove(...activeClasses);
                        this.classList.add(...inactiveClasses);
                        selectedSeat = null;
                        currentPrice = 0;
                        
                        // Update UI to empty state
                        selectionText.textContent = "Aucune place choisie";
                        priceText.textContent = "0 FCFA";
                        
                        // Disable button
                        btnContinue.disabled = true;
                        btnContinue.classList.remove('bg-primary-container', 'text-on-secondary-fixed', 'opacity-100', 'cursor-pointer', 'shadow-lg');
                        btnContinue.classList.add('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                        
                    } else {
                        // Selecting new
                        this.classList.remove(...inactiveClasses);
                        this.classList.add(...activeClasses);
                        selectedSeat = this;
                        currentPrice = seatPrice;
                        
                        // Update UI with selection
                        selectionText.textContent = `Place ${seatId}`;
                        priceText.textContent = `${currentPrice.toLocaleString('fr-FR')} FCFA`;
                        
                        // Enable button with Brand colors
                        btnContinue.disabled = false;
                        btnContinue.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                        btnContinue.classList.add('bg-primary-container', 'text-on-secondary-fixed', 'opacity-100', 'cursor-pointer', 'shadow-lg', 'hover:bg-primary-fixed-dim');
                        
                        // Add slight pulse animation to CTA to draw attention
                        btnContinue.animate([
                            { transform: 'scale(1)' },
                            { transform: 'scale(1.02)' },
                            { transform: 'scale(1)' }
                        ], {
                            duration: 300,
                            easing: 'ease-in-out'
                        });
                    }
                });
            });
        });
    </script>
