<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-secondary">
<!-- Transactional Screen: Navigation Shell Suppressed. Only providing a back action. -->
<header class="w-full flex justify-start items-center px-container-margin h-16 pt-4">
<button aria-label="Retour" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container transition-colors active:scale-95" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<main class="flex-1 flex flex-col px-container-margin py-lg w-full max-w-md mx-auto">
<!-- Illustration -->
<div class="w-full flex justify-center mb-8">
<div class="w-48 h-48 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center p-6 border border-outline-variant/30">
<img class="w-full h-full object-contain" data-alt="A minimalist, flat vector illustration representing a secure mobile verification process. The scene features a sleek, modern smartphone floating slightly above a soft shadow, displaying a glowing lock icon on its screen. A stylized, dynamic speech bubble containing asterisks emerges from the phone, symbolizing an incoming SMS code. The color palette utilizes crisp whites, light grays, and strong accents of dynamic yellow and marine blue, reflecting a modern corporate aesthetic. The overall mood is trustworthy, efficient, and technologically advanced, suitable for a professional mobility app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEeCS4M3J6bABLjyzvoZQl7HCYfrGjaLT0rxQvg9BGsYTrcy9y7hGoGgH9VrgFQkA4wcPkywdePgpH4zceZMMy4wG0sRDSllSg0jimM8Dwq1IquX7xCXGq_rmj28GKeQKd7JQNvS8pf0aAXEkhTlQxptgCJwFqZLGvP6QvmVXiIAChAHH3j3ROulFTczM3Yqxc_exJmtbhYrjmUgw9DlTbYKODTwboRVZHHibzGY1jK2t1-on-XmjL"/>
</div>
</div>
<!-- Typography Header -->
<div class="text-center mb-10">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2">Vérification OTP</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Entrez le code à 4 chiffres envoyé par SMS au <br/>
<span class="font-headline-sm text-headline-sm text-on-surface">+237 6** *** 98</span>
</p>
</div>
<!-- OTP Input Form -->
<form class="flex flex-col flex-1" id="otp-form">
<div class="flex justify-center gap-sm mb-8" id="otp-container">
<input aria-label="Chiffre 1" class="w-16 h-16 rounded-xl border border-outline-variant bg-surface-container-lowest text-center font-display-md text-display-md text-on-surface focus:border-2 focus:border-secondary focus:ring-0 focus:outline-none transition-all shadow-sm" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Chiffre 2" class="w-16 h-16 rounded-xl border border-outline-variant bg-surface-container-lowest text-center font-display-md text-display-md text-on-surface focus:border-2 focus:border-secondary focus:ring-0 focus:outline-none transition-all shadow-sm" disabled="" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Chiffre 3" class="w-16 h-16 rounded-xl border border-outline-variant bg-surface-container-lowest text-center font-display-md text-display-md text-on-surface focus:border-2 focus:border-secondary focus:ring-0 focus:outline-none transition-all shadow-sm" disabled="" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Chiffre 4" class="w-16 h-16 rounded-xl border border-outline-variant bg-surface-container-lowest text-center font-display-md text-display-md text-on-surface focus:border-2 focus:border-secondary focus:ring-0 focus:outline-none transition-all shadow-sm" disabled="" maxlength="1" pattern="\d*" type="number"/>
</div>
<!-- Timer -->
<div class="text-center mb-xl">
<p class="font-label-bold text-label-bold text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary text-[16px]" data-icon="timer">timer</span>
                    Code valide pendant <span class="text-secondary" id="countdown">08:06</span>
</p>
</div>
<div class="mt-auto pb-lg space-y-6">
<!-- Primary Action Button: Dynamic Yellow with Marine Blue text -->
<button class="w-full h-[56px] bg-primary-container text-secondary font-headline-sm text-headline-sm flex items-center justify-center shadow-sm hover:shadow-md hover:bg-primary-fixed-dim transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed rounded-full" disabled="" id="verify-btn" type="submit">
                    Vérifier
                </button>
<!-- Resend Action -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Vous n'avez pas reçu le code ? 
                        <button class="font-headline-sm text-headline-sm text-secondary hover:text-on-secondary-container transition-colors opacity-50 cursor-not-allowed ml-1" disabled="" id="resend-btn" type="button">
                            Renvoyer le code
                        </button>
</p>
</div>
</div>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            const verifyBtn = document.getElementById('verify-btn');
            const countdownEl = document.getElementById('countdown');
            const resendBtn = document.getElementById('resend-btn');
            
            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    if (e.target.value !== '') {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].disabled = false;
                            inputs[index + 1].focus();
                        }
                    }
                    checkCompletion();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        }
                    }
                });
            });

            function checkCompletion() {
                const isComplete = Array.from(inputs).every(input => input.value !== '');
                verifyBtn.disabled = !isComplete;
            }

            // Countdown Timer Logic (10 minutes)
            let timeLeft = 600; 
            let timerId;

            function updateTimer() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft === 0) {
                    clearInterval(timerId);
                    countdownEl.textContent = "00:00";
                    countdownEl.classList.replace('text-secondary', 'text-error');
                    resendBtn.disabled = false;
                    resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    timeLeft--;
                }
            }

            timerId = setInterval(updateTimer, 1000);
            updateTimer(); // Initial call

            // Form Submit Simulation
            document.getElementById('otp-form').addEventListener('submit', (e) => {
                e.preventDefault();
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                setTimeout(() => {
                    // Simulate success
                    verifyBtn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Vérifié';
                    verifyBtn.classList.replace('bg-primary-container', 'bg-[#cce8e4]'); // generic success hint just for interaction feel
                }, 1500);
            });

            // Resend action
            resendBtn.addEventListener('click', () => {
                if(!resendBtn.disabled) {
                    timeLeft = 600;
                    countdownEl.classList.replace('text-error', 'text-secondary');
                    resendBtn.disabled = true;
                    resendBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    clearInterval(timerId);
                    timerId = setInterval(updateTimer, 1000);
                    updateTimer();
                    
                    // Clear inputs
                    inputs.forEach((input, index) => {
                        input.value = '';
                        if(index > 0) input.disabled = true;
                    });
                    inputs[0].focus();
                    verifyBtn.disabled = true;
                }
            });
            
            // Focus first input on load
            inputs[0].focus();
        });
    </script>
</body></html>
